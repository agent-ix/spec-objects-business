manifest_version: 1.0.0
name: spec-objects-business
version: 0.3.0
description: 'Filament Module: tier-2 business ObjectTypes (DDD: domain, entity, value_object, aggregate_root, nested_entity, repository, event, state_machine, process, enumeration)'
semantic:
  contract_version: 1.0.0
  semantic_core: 0.1.0
  package: agent-ix/spec-objects-business
  exports:
  - domain
  - entity
  - value_object
  - aggregate_root
  - nested_entity
  - repository
  - event
  - state_machine
  - process
  - enumeration
  imports: {}
  targets: [json-schema, markdown]
  mappings: [typed-table, sysml-fence, ocl-clause]
  compatibility_posture: additive
  legacy_forms: warning
nav:
  category:
    slug: business
    label: Business
    icon: Boxes
    order: 51
archetypes: []
grammars: []
artifact_types: []
lint_rules: []
object_types:
- name: domain
  allowed_links:
    contains: [entity, aggregate_root, value_object, repository, event, state_machine, process, enumeration]
  data_schema:
    schema: schemas/Domain.json
    digest: sha256:e59103a3718f19aa7b1c9fadabd409cd776776c2ec968b6a93e62d3db9da484c
  body_extraction:
    yield_pattern:
      match:
        id: &id001
          from: frontmatter_field
          path:
          - id
          required: true
        title: &id002
          from: frontmatter_field
          path:
          - title
          required: true
        type: &id003
          from: frontmatter_field
          path:
          - type
          required: true
        # Format-walkthrough decision #18 (2026-06-11): Bounded Context
        # is the domain object's required kernel (20/20 wild domain FRs
        # carry it; 0/20 had '## Entities'). `entities` is an OPTIONAL
        # summary — entities are first-class `entity` FRs linked via
        # `contains` edges, never duplicated inline. The optional `erd`
        # extracts the whole-domain mermaid diagram.
        bounded_context:
          from: section_body
          after_heading: Bounded Context
          required: true
        entities:
          from: section_body
          after_heading: Entities
          required: false
        erd:
          from: code_block
          after_heading: Entity Relationship Diagram
          language: mermaid
          required: false
        ubiquitous_language:
          from: section_body
          after_heading: Ubiquitous Language
          required: false
- name: entity
  roles: [domain-object, persistable]
  allowed_links:
    contains: [nested_entity, value_object]
    owns: [state_machine]
    references: [entity, aggregate_root, enumeration]
  data_schema:
    schema: schemas/Entity.json
    digest: sha256:e06e39445e314d31de3206dc6d715da7245da23f5fcc9745a6147c50ca439790
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        properties:
          from: section_body
          after_heading: Properties
          required: true
- name: value_object
  roles: [domain-object]
  allowed_links:
    composes: [value_object, enumeration]
    references: [enumeration]
  data_schema:
    schema: schemas/ValueObject.json
    digest: sha256:228cc48f5e1162d47df61ba8579a7ec4219d73a026c3951d38d7bc7bf0241fde
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        properties:
          from: section_body
          after_heading: Properties
          required: true
        fields:
          from: section_body
          after_heading: Fields
          required: false
- name: aggregate_root
  roles: [domain-object, persistable]
  allowed_links:
    aggregates: [entity, nested_entity]
    contains: [value_object]
    emits: [event]
    references: [aggregate_root, enumeration]
  data_schema:
    schema: schemas/AggregateRoot.json
    digest: sha256:34c88c2b11f03f071d5ea642f2457003c062ba9855e7da99bb5932d7eafe29ab
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        members:
          from: section_body
          after_heading: Members
          required: true
- name: nested_entity
  roles: [domain-object]
  allowed_links:
    contains: [value_object]
    references: [enumeration]
  data_schema:
    schema: schemas/NestedEntity.json
    digest: sha256:6cb95ea5737df45d199d716c0e38dd6033899b43044b12910a7f487491dec236
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        parent:
          from: section_body
          after_heading: Parent
          required: true
- name: repository
  allowed_links:
    persists: [aggregate_root, entity]
    references: [data_schema]
  data_schema:
    schema: schemas/Repository.json
    digest: sha256:60077f326124031679d4a79f1e3d9c497c31d9456fb6dd753cb22ad6f52340bc
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        operations:
          from: section_body
          after_heading: Operations
          required: true
- name: event
  roles: [event-like]
  allowed_links:
    carries: [value_object, entity]
    references: [aggregate_root, enumeration]
  data_schema:
    schema: schemas/Event.json
    digest: sha256:e1dbf2249b6cdd89712480d828279121be8ddfd870f0bc6373b94c72aa2231e6
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        schema_json:
          from: code_block
          after_heading: Schema
          required: true
          language: json
- name: state_machine
  allowed_links:
    transitions_to: [state_machine]
    raises: [event]
    references: [enumeration]
  data_schema:
    schema: schemas/StateMachine.json
    digest: sha256:ff54d529c04018b62954a61463c60d44b312df313a9cf217e6789b5c047a7a3b
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        operations:
          from: section_body
          after_heading: Operations
          required: false
        diagram:
          from: code_block
          after_heading: States & Transitions
          required: true
          language: mermaid
- name: process
  roles: [measurable]
  allowed_links:
    triggers: [process, action]
    consumes: [event]
    emits: [event]
    reads: [aggregate_root, entity]
    writes: [aggregate_root, entity]
    operates_on: [domain-object]
  data_schema:
    schema: schemas/Process.json
    digest: sha256:84aa7fe0b9b704bd201857284c0c3bd22e389898304010e6006e84b6e1767439
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        # Format-walkthrough decision #13 (2026-06-11): `multiple: true`
        # keeps EVERY Workflow diagram (complex flows split into several
        # smaller diagrams instead of one oversized one); the optional
        # `states` anchor types state diagrams separately.
        diagram:
          from: code_block
          after_heading: Workflow
          required: true
          multiple: true
          language: mermaid
        states:
          from: code_block
          after_heading: States
          required: false
          multiple: true
          language: mermaid
        specification:
          from: section_body
          after_heading: Specification
          required: false
        algorithm:
          from: section_body
          after_heading: Algorithm
          required: false
- name: enumeration
  allowed_links:
    references: [enumeration]
  data_schema:
    schema: schemas/Enumeration.json
    digest: sha256:ac3a95648b40260a5476a23573d6cccf170c10265dd1cb37e26c93cb6246c891
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        # Format-walkthrough decision #7 (2026-06-11): controlled label
        # vocabularies (codec kinds, surface labels, ISA labels, step
        # kinds) as first-class extractable objects instead of prose or
        # values smuggled into data_schema JSON.
        values_table:
          from: table_row
          under_section: Values
          required: true
          assert:
            columns:
            - Value
            - Description
            min_rows: 1
