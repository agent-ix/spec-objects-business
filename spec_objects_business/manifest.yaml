- name: process
  roles: [measurable]
  allowed_links:
    specializes: [process]
    triggers: [process, action]
    consumes: [event]
    emits: [event]
    reads: [aggregate_root, entity]
    writes: [aggregate_root, entity]
    operates_on: [domain-object]
  data_schema:
    schema: schemas/Process.json
    digest: sha256:81b1b42e0c1b51444fffa28d88cb571a3c027deac1847ca404cd4c2c15356ef8
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        steps:
          from: table_row
