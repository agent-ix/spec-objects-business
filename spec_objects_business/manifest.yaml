- name: enumeration
  allowed_links:
    references: [enumeration]
  data_schema:
    schema: schemas/Enumeration.json
    digest: sha256:0b23bccc41d986fce6133ec9a015a70295fe3b704f75644f2cc1e552a2ffe0da
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        # Format-walkthrough decision #7 (2026-06-11): controlled label
        # vocabularies (codec kinds, surface labels, ISA labels, step
        # kinds) as first-class extractable objects instead of prose or
        # values smuggled into data_schema JSON.
        values_table:
          from: table_row
          under_section: Values
          required: true
          assert:
            columns:
            - Value
            - Description
            min_rows: 1
- name: population
  allowed_links:
    references: [entity, aggregate_root, nested_entity, value_object, event, process]
  data_schema:
    schema: schemas/Population.json
    digest: sha256:db36d71836abaa5af3c2b0613002e221f341c65f1d7e3d9bca4be438fa24835b
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        invariants:
          from: section_body
