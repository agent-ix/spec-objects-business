manifest_version: 1.0.0
name: spec-objects-business
version: 0.5.0
description: 'Filament Module: tier-2 business ObjectTypes (DDD: domain, entity, value_object, aggregate_root, nested_entity, repository, event, state_machine, process, enumeration, population)'
semantic:
  contract_version: 1.0.0
  semantic_core: 0.2.0
  package: agent-ix/spec-objects-business
  exports:
  - domain
  - entity
  - value_object
  - aggregate_root
  - nested_entity
  - repository
  - event
  - state_machine
  - process
  - enumeration
  - population
  imports: {}
  targets: [json-schema, markdown]
  mappings: [typed-table, sysml-fence, generalization, abstract-types, presence, subsetting, redefinition, effect-frames, relationships]
  compatibility_posture: strict
  legacy_forms: warning
nav:
  category:
    slug: business
    label: Business
    icon: Boxes
    order: 51
edge_types:
  specializes: { description: "Generalization: the source type specializes the target type and inherits its declarations.", category: structural, inverse: generalizes }
  # The domain verbs the allowed_links below and the `## Relationships`
  # tables use, declared byte-identical to spec-artifacts-iso so a registry
  # that loads both modules merges them without a duplicate-edge-type finding.
  contains: { description: "Composition; the source owns the target's lifecycle.", category: structural, inverse: part_of }
  aggregates: { description: "Aggregate root owns member entities.", category: structural, inverse: part_of }
  composes: { description: "Value object composed of other value objects/enums.", category: structural, inverse: composed_by }
  triggers: { description: "Initiates a process or action.", category: behavioral, inverse: triggered_by }
  transitions_to: { description: "State-machine flow to another state.", category: behavioral }
  raises: { description: "State machine raises a domain event.", category: behavioral }
  reads: { description: "Non-mutating data access.", category: dataflow }
  writes: { description: "Mutating data access.", category: dataflow }
  consumes: { description: "Asynchronous reception from a channel.", category: dataflow }
  emits: { description: "Source produces the target domain event.", category: dataflow, inverse: emitted_by }
  carries: { description: "Channel/event carries a payload type.", category: dataflow }
  persists: { description: "Repository persists an aggregate/entity.", category: dependency }
  owns: { description: "Entity owns a state machine.", category: dependency }
  operates_on: { description: "Process/endpoint manipulates a domain object.", category: realization }
  references: { description: "Loose, untyped linkage.", category: traceability }
archetypes: []
grammars: []
artifact_types: []
lint_rules: []
object_types:
- name: domain
  allowed_links:
    contains: [entity, aggregate_root, value_object, repository, event, state_machine, process, enumeration]
  data_schema:
    schema: schemas/Domain.json
    digest: sha256:471688167079b312b814624e8ad65e7e87693f211ff7bb56b83a7a01e2d2a54f
  body_extraction:
    yield_pattern:
      match:
        id: &id001
          from: frontmatter_field
          path:
          - id
          required: true
        title: &id002
          from: frontmatter_field
          path:
          - title
          required: true
        type: &id003
          from: frontmatter_field
          path:
          - type
          required: true
        # Format-walkthrough decision #18 (2026-06-11): Bounded Context
        # is the domain object's required kernel (20/20 wild domain FRs
        # carry it; 0/20 had '## Entities'). `entities` is an OPTIONAL
        # summary — entities are first-class `entity` FRs linked via
        # `contains` edges, never duplicated inline. The optional `erd`
        # extracts the whole-domain mermaid diagram.
        bounded_context:
          from: section_body
          after_heading: Bounded Context
          required: true
        entities:
          from: section_body
          after_heading: Entities
          required: false
        erd:
          from: code_block
          after_heading: Entity Relationship Diagram
          language: mermaid
          required: false
        vocabulary:
          from: table_row
          under_section: Ubiquitous Language
          required: false
          assert:
            columns: [Term, Description]
            min_rows: 1
- name: entity
  roles: [domain-object, persistable]
  allowed_links:
    specializes: [entity]
    contains: [nested_entity, value_object]
    owns: [state_machine]
    references: [entity, aggregate_root, enumeration]
  data_schema:
    schema: schemas/Entity.json
    digest: sha256:04d2c8fa7424060c4209a3008819848f7735b0c00aff3976bfa15869037271c0
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        properties:
          from: section_body
          after_heading: Properties
          required: true
        relationships:
          from: table_row
          under_section: Relationships
          required: false
          assert:
            columns: [Name, Verb, Target, Multiplicity]
- name: value_object
  roles: [domain-object]
  allowed_links:
    specializes: [value_object]
    composes: [value_object, enumeration]
    references: [enumeration]
  data_schema:
    schema: schemas/ValueObject.json
    digest: sha256:08f7addd58cb0a133428fd2cae15bfa90e8f08165907788d16983206161dc48b
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        properties:
          from: section_body
          after_heading: Properties
          required: true
        fields:
          from: section_body
          after_heading: Fields
          required: false
- name: aggregate_root
  roles: [domain-object, persistable]
  allowed_links:
    specializes: [aggregate_root]
    aggregates: [entity, nested_entity]
    contains: [value_object]
    emits: [event]
    references: [aggregate_root, enumeration]
  data_schema:
    schema: schemas/AggregateRoot.json
    digest: sha256:421c33c6de9a64acfcf8ceb20b0c20b57b3ad729d461abeb0f9ee497fd7795b3
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        members:
          from: table_row
          under_section: Members
          required: true
          assert:
            columns: [Member, Multiplicity]
            min_rows: 1
        relationships:
          from: table_row
          under_section: Relationships
          required: false
          assert:
            columns: [Name, Verb, Target, Multiplicity]
- name: nested_entity
  roles: [domain-object]
  allowed_links:
    specializes: [nested_entity]
    contains: [value_object]
    references: [enumeration]
  data_schema:
    schema: schemas/NestedEntity.json
    digest: sha256:b9fd283abfde768988c6680a5afcf36762c18236be10fd3276c1c92ee4c36746
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        parent:
          from: section_body
          after_heading: Parent
          required: true
- name: repository
  allowed_links:
    persists: [aggregate_root, entity]
    references: [data_schema]
  data_schema:
    schema: schemas/Repository.json
    digest: sha256:43d18942590dc0f7f74da97190c580448708ee817eaf3007be8e919fac9cfd4f
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        operations:
          from: section_body
          after_heading: Operations
          required: true
        relationships:
          from: table_row
          under_section: Relationships
          required: false
          assert:
            columns: [Name, Verb, Target, Multiplicity]
- name: event
  roles: [event-like]
  allowed_links:
    specializes: [event]
    carries: [value_object, entity]
    references: [aggregate_root, enumeration]
  data_schema:
    schema: schemas/Event.json
    digest: sha256:add67e50c4171f789fd908249dcf19fd744a2c32c45da62ad1864a24743f05d5
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        schema_json:
          from: code_block
          after_heading: Schema
          required: true
          language: json
- name: state_machine
  allowed_links:
    specializes: [state_machine]
    transitions_to: [state_machine]
    raises: [event]
    references: [enumeration]
  data_schema:
    schema: schemas/StateMachine.json
    digest: sha256:06e0f85ae26ced2fdbb2ebd3504302bd53c1e97afb0078b9837ead3f11fcc02e
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        operations:
          from: section_body
          after_heading: Operations
          required: false
        states:
          from: table_row
          under_section: States
          required: true
          assert:
            columns: [State, Description]
            min_rows: 1
        transitions:
          from: table_row
          under_section: Transitions
          required: true
          assert:
            columns: [From, To, Trigger, Guard, Emits]
            min_rows: 1
- name: process
  roles: [measurable]
  allowed_links:
    specializes: [process]
    triggers: [process, action]
    consumes: [event]
    emits: [event]
    reads: [aggregate_root, entity]
    writes: [aggregate_root, entity]
    operates_on: [domain-object]
  data_schema:
    schema: schemas/Process.json
    digest: sha256:5d7a4104b0c676906e3d2741978df8409155cbc5f8243d96aad85357db9d1d7a
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        steps:
          from: table_row
          under_section: Workflow
          required: true
          assert:
            columns: [Step, Kind, Consumes, Emits, Description]
            min_rows: 1
        states:
          from: table_row
          under_section: States
          required: false
          assert:
