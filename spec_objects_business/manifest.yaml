    digest: sha256:df782483aae8f92a0b7897c751695c578f2e1608c5f3f37256e032c16bd79df3
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        members:
          from: table_row
          under_section: Members
          required: true
          assert:
            columns: [Member, Multiplicity]
            min_rows: 1
- name: nested_entity
  roles: [domain-object]
  allowed_links:
    specializes: [nested_entity]
    contains: [value_object]
