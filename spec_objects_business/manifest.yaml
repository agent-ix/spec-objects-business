            min_rows: 1
        specification:
          from: section_body
          after_heading: Specification
          required: false
        algorithm:
          from: section_body
          after_heading: Algorithm
          required: false
        relationships:
          from: table_row
          under_section: Relationships
          required: false
          assert:
