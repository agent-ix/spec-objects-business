          required: true
- name: event
  roles: [event-like]
  allowed_links:
    specializes: [event]
    carries: [value_object, entity]
    references: [aggregate_root, enumeration]
  data_schema:
    schema: schemas/Event.json
    digest: sha256:18d36655ed18469e7d543a8fde5ed75affa3f0c4370b010d860100ccea5554cd
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        schema_json:
          from: code_block
          after_heading: Schema
          required: true
          language: json
- name: state_machine
  allowed_links:
    specializes: [state_machine]
    transitions_to: [state_machine]
    raises: [event]
    references: [enumeration]
  data_schema:
