    digest: sha256:7964f7cb457630e03900c7dfbbc0b1b3b7bb06ec41269e2924fc335f623342a0
  body_extraction:
    yield_pattern:
      match:
        id: *id001
        title: *id002
        type: *id003
        properties:
          from: section_body
          after_heading: Properties
          required: false
        invariants:
          from: section_body
          after_heading: Invariants
          required: false
        parent:
